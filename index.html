<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>평가 채점</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#dde2e6; --panel:#ffffff; --panel-2:#f4f7f8;
  --ink:#16212b; --ink-2:#4c5b66; --ink-3:#8494a0;
  --line:#aeb9c1; --line-2:#d6dde1;
  --go:#0a7361; --hold:#a8790a; --stop:#a8172c;
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.scale{height:22px;background:var(--ink);position:relative}
.scale::before{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 1px,transparent 1px 8px)}
.scale::after{content:"";position:absolute;left:0;right:0;bottom:0;height:13px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.9) 0 1.5px,transparent 1.5px 40px)}

header{background:var(--ink);color:#e8eef1;padding:11px 16px}
header b{font-size:15px;font-weight:600;display:block}
header .me{font-size:12px;color:#9fb1bb;margin-top:2px;display:flex;gap:8px;align-items:center}
header .me button{margin-left:auto;background:transparent;border:1px solid #47555f;color:#a9bac3;font-size:11px;padding:3px 8px;border-radius:2px}

.wrap{max-width:640px;margin:0 auto;padding:16px 14px 80px}
.panel{background:var(--panel);border:1px solid var(--line);margin-bottom:14px}
.panel>h2{margin:0;background:var(--ink);color:#eef3f6;font-size:12.5px;font-weight:600;padding:7px 12px;display:flex;align-items:center;gap:8px}
.panel>h2 .st{margin-left:auto;font-weight:500;font-size:11.5px;padding:1px 8px;border-radius:2px;background:#33424d;color:#cfe0e6}
.panel>h2 .st.go{background:var(--go);color:#fff}
.panel>h2 .st.done{background:#5d7a6f;color:#fff}
.panel .body{padding:14px}

button{font:inherit;font-size:14px;border:1px solid var(--ink);background:var(--panel);color:var(--ink);padding:9px 14px;cursor:pointer;border-radius:2px}
button.primary{background:var(--ink);color:#fff;width:100%;font-size:15px;padding:12px}
button.primary:disabled{background:var(--line);border-color:var(--line);color:#fff;cursor:not-allowed}
button.ghost{border-color:var(--line);color:var(--ink-2)}
button:focus-visible,input:focus-visible{outline:2px solid var(--go);outline-offset:2px}
input[type=text]{font:inherit;font-size:15px;border:1px solid var(--line);background:#fff;padding:10px;border-radius:2px;width:100%;color:var(--ink)}

/* 게이지 — 이 화면의 중심 조형 */
.cri{padding:14px 0;border-bottom:1px dotted var(--line-2)}
.cri:first-child{padding-top:2px}
.cri:last-child{border-bottom:none;padding-bottom:4px}
.cri .top{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.cri .lab{font-weight:600;font-size:15px}
.cri .max{color:var(--ink-3);font-size:12px;font-family:var(--mono)}
.cri .desc{color:var(--ink-2);font-size:12.5px;margin-bottom:10px;word-break:keep-all}
.gauge{display:grid;grid-template-columns:1fr 84px;gap:12px;align-items:center}
.track{position:relative}
.ticks{height:9px;border-left:1px solid var(--line);border-right:1px solid var(--line);
  background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px var(--gap,10%));}
.scaleNums{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:1px}
input[type=range]{width:100%;margin:6px 0 0;accent-color:var(--ink);height:26px}
.readout{border:1px solid var(--line);background:#fff;padding:7px 4px;text-align:center;font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.readout.off{color:var(--line);background:var(--panel-2)}
.stepbtns{display:flex;gap:4px;margin-top:5px}
.stepbtns button{flex:1;padding:4px 0;font-size:13px;border-color:var(--line-2);color:var(--ink-2);font-family:var(--mono)}

.totalrow{display:flex;align-items:baseline;gap:8px;padding:12px 0 14px;border-top:2px solid var(--ink);margin-top:6px}
.totalrow .t{font-size:13px;color:var(--ink-2)}
.totalrow .v{margin-left:auto;font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.totalrow .m{font-family:var(--mono);font-size:14px;color:var(--ink-3)}

.empty{text-align:center;padding:40px 16px;color:var(--ink-2)}
.empty .big{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:6px}
.banner{padding:10px 13px;border:1px solid var(--stop);background:#fbeef0;color:var(--stop);margin-bottom:14px;font-size:13px}
.banner.warn{border-color:var(--hold);background:#fdf6e6;color:#7a5a05}
.hidden{display:none!important}
.saved{font-size:12.5px;color:var(--go);display:flex;gap:6px;align-items:center}
.restale{background:#fdf6e6;border:1px solid var(--hold);color:#7a5a05;padding:9px 11px;font-size:13px;margin-bottom:12px}

/* 대상 선택 — 번호 버튼 줄 */
.nav{position:sticky;top:0;z-index:5;background:var(--ground);margin:-16px -14px 14px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;padding-bottom:5px;-webkit-overflow-scrolling:touch}
.chip{width:42px;height:42px;padding:0;border:1px solid var(--line);background:#fff;color:var(--ink-2);
  font-family:var(--mono);font-size:16px;font-weight:600;border-radius:2px;position:relative;
  display:flex;align-items:center;justify-content:center;flex:none}
.chip.ready{border-style:dashed;color:var(--ink-3);background:var(--panel-2)}
.chip.open{border:2px solid var(--go);color:var(--go)}
.chip.miss{border-color:var(--stop);color:var(--stop)}
.chip.stale{border-color:var(--hold);color:var(--hold)}
.chip.sent::after{content:"";position:absolute;left:2px;right:2px;bottom:2px;height:4px;background:var(--go)}
.chip.sent.closedone::after{background:var(--ink-3)}
.chip.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.sel.open{background:var(--go);border-color:var(--go);color:#fff}
.chip.sel::after{background:#fff!important}
.chip:disabled{cursor:not-allowed}
.navmeta{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.navmeta .nm{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navmeta .cnt{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);flex:none}
.legend{margin-top:7px;font-size:11px;color:var(--ink-3);line-height:1.5}
.legend b{font-weight:600;color:var(--go)}
.legend s{text-decoration:none;color:var(--stop)}
.modal{position:fixed;inset:0;background:rgba(22,33,43,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:18px}
.mbox{background:#fff;border:1px solid var(--ink);max-width:400px;width:100%}
.mbox h3{margin:0;background:var(--ink);color:#eef3f6;font-size:13px;padding:9px 13px;font-weight:600}
.mbody{padding:15px;font-size:14px;line-height:1.6}
.mfoot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line-2)}
.mfoot button{flex:1}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;font-size:14px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="scale"></div>
<header>
  <b id="hTitle">평가 채점</b>
  <div class="me"><span id="hMe">—</span><button id="btnReset" class="hidden">나가기</button></div>
</header>

<div class="wrap">
  <div id="dbWarn" class="banner hidden"></div>
  <div id="kickNote" class="banner hidden">운영자가 명단에서 제외했습니다. 계속 참여하시려면 아래에서 다시 등록해 주세요.</div>

  <!-- 등록 -->
  <section id="reg" class="panel hidden">
    <h2 id="regTitle">심사위원 입장</h2>
    <div class="body">
      <p id="regHint" style="margin:0 0 14px;color:var(--ink-2);font-size:13px">공개 화면에는 평균만 표시되고, 누가 몇 점을 주었는지는 나오지 않습니다.</p>

      <div id="regRoster">
        <div style="font-size:12.5px;color:var(--ink-2);margin-bottom:4px">사번</div>
        <input type="text" id="jNo" inputmode="numeric" autocomplete="off" placeholder="사번을 입력하세요">
        <button class="primary" id="btnJoin" style="margin-top:14px">입장</button>
      </div>

      <div id="regOpen" class="hidden" style="display:flex;flex-direction:column;gap:10px">
        <div><div style="font-size:12.5px;color:var(--ink-2);margin-bottom:4px">성명</div><input type="text" id="rName" autocomplete="name"></div>
        <div><div style="font-size:12.5px;color:var(--ink-2);margin-bottom:4px">사번</div><input type="text" id="rNo" inputmode="numeric" autocomplete="off"></div>
        <div><div style="font-size:12.5px;color:var(--ink-2);margin-bottom:4px">소속</div><input type="text" id="rDept" autocomplete="organization"></div>
        <div><div style="font-size:12.5px;color:var(--ink-2);margin-bottom:4px">직위</div><input type="text" id="rPos" autocomplete="organization-title"></div>
        <button class="primary" id="btnReg" style="margin-top:4px">등록하고 시작하기</button>
      </div>

      <div id="regErr" class="banner hidden" style="margin:12px 0 0"></div>
    </div>
  </section>

  <!-- 채점 -->
  <div id="nav" class="nav hidden"></div>
  <div id="board" class="hidden"></div>
</div>
<div id="dlg" class="modal hidden"><div class="mbox">
  <h3 id="dlgTitle"></h3>
  <div class="mbody" id="dlgMsg"></div>
  <div class="mfoot"><button id="dlgCancel" class="ghost">취소</button><button id="dlgOk" class="primary">확인</button></div>
</div></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   DATABASE_URL 은 admin.html / screen.html 과 반드시 같은 값이어야 합니다.
   Firebase 콘솔 > Realtime Database 화면 맨 위 주소를 그대로 넣으세요.
   ══════════════════════════════════════════════════════════════ */
const DATABASE_URL = "https://score-ee66c-default-rtdb.asia-southeast1.firebasedatabase.app";

const firebaseConfig = {
  apiKey: "AIzaSyCXGmsExbOCnvxDZpXcL1A10FlKeGZjjUI",
  authDomain: "score-ee66c.firebaseapp.com",
  projectId: "score-ee66c",
  storageBucket: "score-ee66c.firebasestorage.app",
  messagingSenderId: "133802236314",
  appId: "1:133802236314:web:e75ae03d56f2c0ee058223",
  databaseURL: DATABASE_URL
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v,d=0) => { const n = Number(v); return isFinite(n) ? n : d; };
const clean = c => String(c||'').trim().replace(/[.#$\[\]\/\s]/g,'');
/* ── 화면 안 대화상자 (브라우저 기본 창을 쓰지 않습니다) ── */
let dlgRes = null;
function dialog(o){
  return new Promise(res => {
    dlgRes = res;
    $('#dlgTitle').textContent = o.title || '확인';
    $('#dlgMsg').innerHTML = o.msg || '';
    const ok = $('#dlgOk');
    ok.textContent = o.ok || '확인';
    ok.className = o.danger ? 'danger' : 'primary';
    $('#dlgCancel').classList.toggle('hidden', o.cancel === null);
    $('#dlg').classList.remove('hidden');
    setTimeout(() => ok.focus(), 30);
  });
}
function dlgClose(v){ $('#dlg').classList.add('hidden'); const r = dlgRes; dlgRes = null; if (r) r(v); }
const notify = (msg, title) => dialog({ title: title || '알림', msg, cancel: null });
const ask    = (msg, o) => dialog(Object.assign({ title: '확인', msg }, o || {}));

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1900); }
function lsGet(k,d){ try { return JSON.parse(localStorage.getItem(k)) || d; } catch(e) { return d; } }
function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }


/* ── 연결 확인 ── */
let ok = false;
db.ref('.info/connected').on('value', s => { if (s.val() === true) ok = true; });
setTimeout(() => { if (!ok) { $('#dbWarn').classList.remove('hidden'); $('#dbWarn').textContent = '서버에 연결되지 않았습니다. 네트워크를 확인하고 새로고침해 주세요.'; } }, 6000);

/* ── 어느 세션에 붙을지 ──
   주소에 ?s=코드 가 있으면 그 세션을 고정으로 씨고,
   없으면 admin 에서 지정한 '지금 쓰는 세션'에 자동으로 붙습니다. */
const FIXED = clean(new URLSearchParams(location.search).get('s'));
let CODE = null, S = null, LK = null;
let ME = null, MYSC = {};
let D = { config:{}, criteria:{}, subjects:{}, progress:{} };
let draft = {};
let SEL = null;   // 지금 보고 있는 평가 대상

if (FIXED) boot(FIXED);
else db.ref('activeSession').on('value', s => {
  const c = clean(s.val()) || 'main';
  if (CODE === null) boot(c);
  else if (c !== CODE) location.reload();
});

function boot(code){
  CODE = code;
  S = db.ref('sessions/' + CODE);
  LK = { me: 'sc.' + CODE + '.me', sc: 'sc.' + CODE + '.scores', sent: 'sc.' + CODE + '.sent', reset: 'sc.' + CODE + '.reset' };
  ME = lsGet(LK.me, null);
  MYSC = lsGet(LK.sc, {});
  ['config','criteria','subjects','progress'].forEach(p => S.child(p).on('value', s => { D[p] = s.val() || {}; render(); }));
  watchMe();
  render();
}

function criList(){ return Object.entries(D.criteria||{}).sort((a,b)=>num(a[1].order)-num(b[1].order)); }
function subList(){ return Object.entries(D.subjects||{}).sort((a,b)=>num(a[1].order)-num(b[1].order)); }

/* ── 내 등록이 살아있는지 ──
   명단과 개별 점수는 관리자만 읽을 수 있어서, 이름이 들어있지 않은
   '제외 표시' 경로만 공개로 두고 그것만 구독합니다. */
function watchMe(){
  if (!ME || !ME.rid) return;
  S.child('revoked/' + ME.rid).on('value', s => { if (s.val()) knockout(); });
  S.child('revoked/' + ME.rid).once('value').then(s => {
    if (!s.val()) S.child('roster/' + ME.rid).set(num(ME.at, Date.now())).catch(()=>{});
  }).catch(()=>{});
}
function knockout(){
  [LK.me, LK.sc, LK.sent].forEach(k => localStorage.removeItem(k));
  ME = null; MYSC = {}; draft = {}; SEL = null;
  $('#kickNote').classList.remove('hidden');
  render();
  window.scrollTo(0,0);
}

/* ── 사번으로 입장 (사전 등록 방식) ──
   pass/{사번} 은 정확한 사번을 알아야 그 한 칸만 읽힙니다. 명단 전체 조회는 막혀 있습니다. */
function regErr(msg){ const b = $('#regErr'); b.classList.remove('hidden'); b.textContent = msg; }
$('#btnJoin').onclick = () => {
  if (!S) return;
  const key = clean($('#jNo').value);
  if (!key) { regErr('사번을 입력해 주세요.'); $('#jNo').focus(); return; }
  $('#regErr').classList.add('hidden');
  const btn = $('#btnJoin'); btn.disabled = true; btn.textContent = '확인 중';
  S.child('pass/' + key).once('value').then(sn => {
    const p = sn.val();
    btn.disabled = false; btn.textContent = '입장';
    if (!p || !p.rid) { regErr('명단에 없는 사번입니다. 운영자에게 문의해 주세요.'); return; }
    ME = { rid: p.rid, name: p.name || '', dept: p.dept || '', position: p.position || '', empno: key, at: Date.now() };
    lsSet(LK.me, ME);
    S.child('roster/' + p.rid).set(ME.at).catch(()=>{});   /* 실제 입장한 사람만 분모에 들어갑니다 */
    $('#kickNote').classList.add('hidden');
    $('#reg').classList.add('hidden');
    watchMe(); render();
    toast((p.name || '') + '님, 입장했습니다');
  }).catch(() => { btn.disabled = false; btn.textContent = '입장'; regErr('조회하지 못했습니다. 잠시 후 다시 시도해 주세요.'); });
};
$('#jNo').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnJoin').click(); });

/* ── 직접 등록 (자유 입장 방식) ── */
$('#btnReg').onclick = () => {
  if (!S) return;
  const name = $('#rName').value.trim();
  if (!name) { const b = $('#regErr'); b.classList.remove('hidden'); b.textContent = '성명을 입력해 주세요.'; $('#rName').focus(); return; }
  const rid = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const at = Date.now();
  const rec = { name, empno: $('#rNo').value.trim(), dept: $('#rDept').value.trim(), position: $('#rPos').value.trim(), at };
  S.child('raters/' + rid).set(rec).then(() => {
    S.child('roster/' + rid).set(at).catch(()=>{});
    ME = Object.assign({ rid }, rec);
    lsSet(LK.me, ME);
    $('#kickNote').classList.add('hidden');
    $('#reg').classList.add('hidden');
    watchMe();
    render();
    toast('등록되었습니다');
  }).catch(err => {
    const b = $('#regErr'); b.classList.remove('hidden');
    b.textContent = '등록하지 못했습니다. 세션 주소가 맞는지 확인해 주세요. (' + err.code + ')';
  });
};
$('#btnReset').onclick = async () => {
  if (!await ask('이 기기에서 나갑니다. 서버에 제출한 점수는 그대로 남고, 같은 사번으로 다시 들어오면 이어서 볼 수 있습니다.', { title:'나가기', ok:'나가기' })) return;
  [LK.me, LK.sc, LK.sent].forEach(k => localStorage.removeItem(k));
  location.reload();
};

/* ── 렌더 ── */
function rosterMode(){ return (D.config||{}).joinMode !== 'open'; }

/* 운영자가 채점을 초기화하면 이 기기에 남은 점수 값도 함께 지웁니다.
   제출 여부 자체는 서버 표식으로 판정하므로 초기화 즉시 사라집니다. */
function applyReset(){
  if (!LK) return;
  const r = num((D.config||{}).resetAt, 0);
  if (!r) return;
  const seen = num(lsGet(LK.reset, 0), 0);
  if (r <= seen) return;
  const had = Object.keys(MYSC).length;
  MYSC = {}; draft = {}; SEL = null;
  localStorage.removeItem(LK.sc);
  localStorage.removeItem(LK.sent);
  lsSet(LK.reset, r);
  if (had && seen) toast('운영자가 채점을 초기화했습니다');
}
function showReg(){
  $('#reg').classList.remove('hidden');
  $('#board').classList.add('hidden');
  $('#nav').classList.add('hidden');
  $('#btnReset').classList.add('hidden');
  $('#hMe').textContent = CODE ? '입장 전' : '연결 중';
  const r = rosterMode();
  $('#regRoster').classList.toggle('hidden', !r);
  $('#regOpen').classList.toggle('hidden', r);
  $('#regTitle').textContent = r ? '심사위원 입장' : '심사위원 등록';
  $('#regHint').textContent = r
    ? '운영자가 미리 등록한 명단으로 입장합니다. 사번을 입력해 주세요. 공개 화면에는 평균만 표시되고 누가 몇 점을 주었는지는 나오지 않습니다.'
    : '공개 화면에는 평균만 표시되고, 누가 몇 점을 주었는지는 나오지 않습니다. 등록 정보는 운영자 확인용입니다.';
}
/* 화면에는 한 번에 한 대상만 띄우고, 위쪽 번호 버튼으로 옮겨 다닙니다. */
function editableOf(sv){
  if (!sv) return false;
  if (sv.state === 'open') return true;
  if (sv.state === 'closed') return (D.config||{}).allowEditClosed !== false;
  return false;
}
/* 저장하지 않은 수정이 남아 있는지 — 남아 있으면 자동 이동을 멈춥니다 */
function dirty(sid, cri){
  const d = draft[sid]; if (!d) return false;
  const mine = MYSC[sid] || {};
  return cri.some(([cid]) => d[cid] && d[cid].touched && num(mine[cid], -1) !== d[cid].v);
}
function pickDefault(subs, cri){
  const open = subs.filter(([,v]) => v.state === 'open');
  const openUnsent = open.filter(([id]) => !sentOf(id) || needsResubmit(id, cri));
  if (openUnsent.length) return openUnsent[0][0];
  if (open.length) return open[open.length-1][0];
  const missed = subs.filter(([id,v]) => v.state === 'closed' && !sentOf(id));
  if (missed.length) return missed[0][0];
  const closed = subs.filter(([,v]) => v.state === 'closed');
  if (closed.length) return closed[closed.length-1][0];
  return subs.length ? subs[0][0] : null;
}

function render(){
  applyReset();
  $('#hTitle').textContent = (D.config||{}).title || '평가 채점';
  if (!ME) { showReg(); return; }
  $('#hMe').textContent = ME.name + (ME.dept ? ' · ' + ME.dept : '') + (ME.position ? ' ' + ME.position : '');
  $('#btnReset').classList.remove('hidden');
  $('#reg').classList.add('hidden');
  $('#board').classList.remove('hidden');

  const cri = criList(), subs = subList();
  const byId = {}; subs.forEach(([id,v]) => byId[id] = v);

  if (!cri.length || !subs.length) {
    $('#nav').classList.add('hidden');
    $('#board').innerHTML = '<div class="panel"><div class="body"><div class="empty"><div class="big">아직 준비 중입니다</div>운영자가 평가 문항과 대상을 등록하면 여기에 나타납니다.</div></div></div>';
    return;
  }
  syncDraft(cri);
  const maxTotal = cri.reduce((s,[,v])=>s+num(v.max),0);

  /* 선택 대상 정하기 — 보던 대상이 마감되고 새로 열린 게 있으면 따라갑니다 */
  if (!SEL || !byId[SEL]) SEL = pickDefault(subs, cri);
  else if (byId[SEL].state !== 'open' && !dirty(SEL, cri)) {
    const open = subs.filter(([,v]) => v.state === 'open');
    if (open.length) SEL = open[open.length-1][0];
  }

  const sentCount = subs.filter(([id]) => sentOf(id) && !needsResubmit(id, cri)).length;
  const sv = byId[SEL] || {};
  const idx = subs.findIndex(([id]) => id === SEL);

  /* 번호 버튼 */
  const chips = subs.map(([id,v], i) => {
    const sent = sentOf(id), stale = needsResubmit(id, cri);
    const cls = ['chip'];
    if (v.state === 'ready') cls.push('ready');
    if (v.state === 'open') cls.push('open');
    if (v.state === 'closed') { cls.push('closedone'); if (!sent) cls.push('miss'); }
    if (stale) cls.push('stale');
    if (sent && !stale) cls.push('sent');
    if (id === SEL) cls.push('sel');
    const label = (i+1) + '번 ' + (v.name || '') + ' · ' +
      (v.state === 'ready' ? '아직 열리지 않음' : v.state === 'open' ? '채점 가능' : '마감') +
      (stale ? ' · 재제출 필요' : sent ? ' · 제출 완료' : ' · 미제출');
    return '<button class="' + cls.join(' ') + '" data-sid="' + id + '" aria-label="' + esc(label) + '"' +
      (v.state === 'ready' ? ' disabled' : '') + '>' + (i+1) + '</button>';
  }).join('');

  $('#nav').classList.remove('hidden');
  $('#nav').innerHTML = '<div class="chips' + (subs.length > 12 ? ' scrollx' : '') + '">' + chips + '</div>' +
    '<div class="navmeta"><span class="nm">' + (idx >= 0 ? (idx+1) + '. ' : '') + esc(sv.name || '') + '</span>' +
    '<span class="cnt">제출 ' + sentCount + ' / ' + subs.length + '</span></div>' +
    '<div class="legend"><b>초록</b> 지금 채점 가능 · <b>아래 줄</b> 제출 완료 · <s>빨강</s> 마감됐는데 미제출 · 점선 아직 안 열림</div>';
  $('#nav').querySelectorAll('.chip').forEach(b => b.onclick = () => {
    SEL = b.dataset.sid; render(); window.scrollTo({ top: 0, behavior: 'auto' });
  });

  /* 선택된 대상 하나만 */
  if (sv.state === 'ready') {
    $('#board').innerHTML = '<div class="panel"><div class="body"><div class="empty"><div class="big">채점 대기 중</div>이 대상은 아직 열리지 않았습니다.<br>발표가 시작되면 운영자가 채점 칸을 열어 줍니다.</div></div></div>';
    return;
  }
  $('#board').innerHTML = card(SEL, sv, cri, maxTotal, editableOf(sv));
  wire(cri, maxTotal);
}

/* 문항이나 배점이 바뀜을 때 편집 중인 값을 맞춥니다 */
function syncDraft(cri){
  const ids = new Set(cri.map(([cid]) => cid));
  Object.keys(draft).forEach(sid => {
    Object.keys(draft[sid]).forEach(cid => { if (!ids.has(cid)) delete draft[sid][cid]; });
  });
  cri.forEach(([cid, c]) => {
    const mx = Math.max(1, num(c.max, 25));
    Object.keys(draft).forEach(sid => {
      const d = draft[sid][cid];
      if (d && d.v > mx) d.v = mx;
    });
  });
}
/* 제출 여부는 서버의 제출 표식으로 판정합니다.
   이름 없는 무작위 ID만 들어 있어서, 누가 몇 점을 줬는지는 여전히 알 수 없습니다.
   운영자가 초기화하면 이 표식이 사라지므로 모든 기기에서 즉시 반영됩니다. */
function sentOf(sid){ return !!((((D.progress||{})[sid]) || {})[(ME||{}).rid]); }
/* 제출은 되어 있는데 점수 값이 이 기기에 없는 경우 (다른 기기에서 제출) */
function noLocal(sid){ return sentOf(sid) && !MYSC[sid]; }
/* 제출했지만 이후 문항이 추가되어 빠진 값이 있는 경우 */
function needsResubmit(sid, cri){
  if (!sentOf(sid) || !MYSC[sid]) return false;
  const mine = MYSC[sid];
  return cri.some(([cid]) => mine[cid] === undefined || mine[cid] === null);
}

function card(sid, sv, cri, maxTotal, editable){
  const stale = needsResubmit(sid, cri);
  const sent = sentOf(sid) && !stale;
  const away = noLocal(sid);
  const mine = MYSC[sid] || {};
  const st = stale ? '다시 제출 필요'
    : sent ? (away ? '제출 완료 (다른 기기)' : (editable ? '제출 완료 · 수정 가능' : '제출 완료'))
    : (editable ? '채점 가능' : '미제출 · 마감됨');
  const stc = stale ? '' : (sent ? 'done' : (editable ? 'go' : ''));
  const d = draft[sid] || (draft[sid] = {});
  cri.forEach(([cid,cv]) => {
    const mx = Math.max(1, num(cv.max, 25));
    if (d[cid] === undefined) {
      const has = mine[cid] !== undefined && mine[cid] !== null;
      d[cid] = { v: has ? Math.min(mx, num(mine[cid])) : Math.round(mx / 2), touched: has };
    }
  });
  const body = cri.map(([cid,cv]) => {
    const mx = Math.max(1, num(cv.max, 25));
    const marks = Math.min(10, mx);
    const val = Math.min(mx, d[cid].v), touched = d[cid].touched;
    return '<div class="cri" data-cid="' + cid + '">' +
      '<div class="top"><span class="lab">' + esc(cv.label) + '</span><span class="max">/ ' + mx + '점</span></div>' +
      (cv.desc ? '<div class="desc">' + esc(cv.desc) + '</div>' : '') +
      '<div class="gauge"><div class="track">' +
        '<div class="ticks" style="--gap:' + (100/marks).toFixed(3) + '%"></div>' +
        '<div class="scaleNums"><span>0</span><span>' + Math.round(mx/2) + '</span><span>' + mx + '</span></div>' +
        '<input type="range" min="0" max="' + mx + '" step="1" value="' + val + '" ' + (editable?'':'disabled') + ' aria-label="' + esc(cv.label) + '">' +
      '</div><div>' +
        '<div class="readout ' + (touched?'':'off') + '">' + (touched ? val : '—') + '</div>' +
        '<div class="stepbtns"><button data-d="-1" ' + (editable?'':'disabled') + '>−</button><button data-d="1" ' + (editable?'':'disabled') + '>＋</button></div>' +
      '</div></div></div>';
  }).join('');
  const done = cri.every(([cid]) => d[cid].touched);
  const total = cri.reduce((s,[cid]) => s + (d[cid].touched ? Math.min(num(D.criteria[cid] && D.criteria[cid].max, 25), d[cid].v) : 0), 0);
  return '<section class="panel" data-sid="' + sid + '">' +
    '<h2>' + esc(sv.name) + (sv.desc ? ' · ' + esc(sv.desc) : '') + '<span class="st ' + stc + '">' + st + '</span></h2>' +
    '<div class="body">' +
      (stale ? '<div class="restale">제출 이후에 평가 문항이 바뀌었습니다. 비어 있는 문항을 채워 다시 제출해 주세요. 그전까지 이 제출은 평균에 반영되지 않습니다.</div>' : '') +
      (away && !stale ? '<div class="restale">다른 기기에서 제출한 기록이 있습니다. 이 기기에는 점수가 남아 있지 않아 값이 비어 있습니다. 다시 매겨 제출하면 덮어씁니다.</div>' : '') +
      body +
      '<div class="totalrow"><span class="t">총점</span><span class="v" data-total>' + (done ? total : '—') + '</span><span class="m">/ ' + maxTotal + '</span></div>' +
      (editable
        ? '<button class="primary" data-submit ' + (done?'':'disabled') + '>' + (sent ? '수정 내용 저장' : '제출') + '</button>' +
          (done ? '' : '<div style="text-align:center;font-size:12.5px;color:var(--ink-3);margin-top:8px">모든 문항을 한 번씩 조정해야 제출됩니다</div>')
        : '<div style="text-align:center;font-size:13px;color:var(--ink-3)">이 대상은 마감되었습니다</div>') +
    '</div></section>';
}

function wire(cri, maxTotal){
  document.querySelectorAll('section.panel[data-sid]').forEach(sec => {
    const sid = sec.dataset.sid, d = draft[sid];
    sec.querySelectorAll('.cri').forEach(row => {
      const cid = row.dataset.cid;
      const rng = row.querySelector('input[type=range]');
      const out = row.querySelector('.readout');
      const set = v => {
        const mx = num(rng.max, 25);
        v = Math.max(0, Math.min(mx, Math.round(v)));
        d[cid] = { v, touched: true };
        rng.value = v; out.textContent = v; out.classList.remove('off');
        refresh(sec, cri);
      };
      rng.addEventListener('input', () => set(num(rng.value)));
      row.querySelectorAll('.stepbtns button').forEach(b => b.onclick = () => set(num(rng.value) + num(b.dataset.d)));
    });
    const btn = sec.querySelector('[data-submit]');
    if (btn) btn.onclick = () => submit(sid, cri, sec);
  });
}
function refresh(sec, cri){
  const sid = sec.dataset.sid, d = draft[sid];
  const done = cri.every(([cid]) => d[cid] && d[cid].touched);
  const total = cri.reduce((s,[cid]) => s + (d[cid] && d[cid].touched ? d[cid].v : 0), 0);
  sec.querySelector('[data-total]').textContent = done ? total : '—';
  const btn = sec.querySelector('[data-submit]');
  if (btn) btn.disabled = !done;
}
function submit(sid, cri, sec){
  const d = draft[sid];
  const v = {}; let total = 0;
  cri.forEach(([cid, c]) => {
    const mx = Math.max(1, num(c.max, 25));
    const val = Math.max(0, Math.min(mx, num(d[cid].v)));
    v[cid] = val; total += val;
  });
  const btn = sec.querySelector('[data-submit]');
  btn.disabled = true; btn.textContent = '저장 중';
  S.child('scores/' + sid + '/' + ME.rid).set({ v, total, at: Date.now() })
   .then(() => S.child('progress/' + sid + '/' + ME.rid).set(Date.now()))
   .then(() => {
    MYSC[sid] = v;
    lsSet(LK.sc, MYSC);
    toast('제출되었습니다');
    const rest = subList().find(([id,sv]) => sv.state === 'open' && id !== sid && (!sentOf(id) || needsResubmit(id, cri)));
    if (rest) { SEL = rest[0]; window.scrollTo({ top: 0, behavior: 'auto' }); }
    render();
  }).catch(err => {
    btn.disabled = false; btn.textContent = '제출';
    notify(err.code === 'PERMISSION_DENIED'
      ? '이 대상은 지금 채점할 수 없습니다. 운영자가 마감했거나 아직 열지 않았습니다.'
      : '제출하지 못했습니다. 잠시 후 다시 시도해 주세요.', '제출 실패');
  });
}

$('#dlgOk').onclick = () => dlgClose(true);
$('#dlgCancel').onclick = () => dlgClose(null);
$('#dlg').onclick = e => { if (e.target.id === 'dlg') dlgClose(null); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').classList.contains('hidden')) dlgClose(null); });

showReg();
</script>
</body>
</html>
